services:
  - type: web
    name: onefolio-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://onefolio.pages.dev
      # 접속 암호. 값은 대시보드에서 넣는다 — 비우면 누구나 API 를 호출할 수 있다.
      - key: APP_TOKEN
        sync: false
