<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS 는 manifest 의 아이콘을 안 보고 이것만 쓴다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#eaf1fe" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneFolio</title>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background: #fcfcfb;
        opacity: 0;
        animation: boot-in 0.18s ease forwards;
      }
      .boot p {
        margin: 0;
        font: 600 1.3rem/1 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
        letter-spacing: -0.02em;
        color: #0b0b0b;
      }
      .boot-mark {
        width: 96px;
        height: 96px;
        animation: boot-spin 2.4s linear infinite;
      }
      @keyframes boot-in { to { opacity: 1 } }
      @keyframes boot-spin { to { transform: rotate(360deg) } }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark { animation: none }
      }
      :root[data-theme='dark'] .boot { background: #1a1a19 }
      :root[data-theme='dark'] .boot p { color: #ffffff }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .boot { background: #1a1a19 }
        :root:not([data-theme='light']) .boot p { color: #ffffff }
      }
    </style>
    <!-- 앱이 뜨기 전에 테마를 입혀야 반대 색으로 한 번 번쩍이지 않는다 -->
    <script>
      try {
        const saved = localStorage.getItem('onefolio-theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch {}
    </script>
  </head>
  <body>
    <!-- 자바스크립트가 받아지기 전까지 빈 화면이라, 문서와 함께 그려지는 정적
         화면을 미리 깔아 둔다. React 가 뜨면 이 자리를 통째로 갈아치운다.
         0.25초 뒤에야 서서히 나타나므로 빨리 뜨는 화면에서는 보이지 않는다. -->
    <div id="root">
      <div class="boot">
        <svg class="boot-mark" viewBox="4.6 4.6 22.8 22.8" aria-hidden="true">
          <g fill="none" stroke-width="5.5" stroke-linecap="round" transform="rotate(-90 16 16)">
            <circle cx="16" cy="16" r="8.2" pathLength="100" stroke="#5b93f0" stroke-dasharray="44 56" />
            <circle cx="16" cy="16" r="8.2" pathLength="100" stroke="#ffb26b" stroke-dasharray="26 74" stroke-dashoffset="-48" />
            <circle cx="16" cy="16" r="8.2" pathLength="100" stroke="#5ddab4" stroke-dasharray="20 80" stroke-dashoffset="-78" />
          </g>
        </svg>
        <p>OneFolio</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
